name: UTILIA Formatter Helper

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: false
          pub-cache: false
      - name: Format Dart sources
        run: dart format lib test
      - name: Upload formatted sources
        uses: actions/upload-artifact@v6
        with:
          name: utilia-formatted-dart
          path: |
            lib/utilia_design.dart
