name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - run: flutter pub get

      - name: Repair source issues detected by analyzer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              'lib/tool_calculator_page.dart': [
                  ("import 'catalog.dart';\n", ''),
                  ("Text(widget.s.result,\n", "Text(widget.s.result, style: Theme.of(context).textTheme.bodyMedium),\n"),
              ],
              'lib/category_page.dart': [
                  ("import 'catalog.dart';\n", ''),
              ],
              'lib/calculator_suite.dart': [
                  ("_small('sin(', 'sin(')", "_small('sin', 'sin(')"),
                  ("_small('cos(', 'cos(')", "_small('cos', 'cos(')"),
                  ("_small('tan(', 'tan(')", "_small('tan', 'tan(')"),
                  ("_small('ln(', 'ln(')", "_small('ln', 'ln(')"),
                  ("_small('log(', 'log(')", "_small('log', 'log(')"),
              ],
          }

          changed = False
          for filename, replacements in fixes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True
                  print(f'Fixed {filename}')

          calc = Path('lib/calculator_suite.dart')
          lines = calc.read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if line.startswith('  Widget _display('):
                  replacement = [
                      '  Widget _display(bool compact, bool dark) => Container(',
                      '    height: compact ? 112 : 145,',
                      '    margin: const EdgeInsets.fromLTRB(14, 4, 14, 8),',
                      '    padding: const EdgeInsets.fromLTRB(17, 14, 17, 12),',
                      '    decoration: BoxDecoration(',
                      '      color: dark ? const Color(0xFF0F1B2A) : Colors.white,',
                      '      borderRadius: BorderRadius.circular(20),',
                      '    ),',
                      '    child: Column(',
                      '      crossAxisAlignment: CrossAxisAlignment.end,',
                      '      children: [',
                      '        Expanded(',
                      '          child: Align(',
                      '            alignment: Alignment.centerRight,',
                      '            child: SingleChildScrollView(',
                      '              scrollDirection: Axis.horizontal,',
                      '              reverse: true,',
                      '              child: Text(',
                      "                expression.isEmpty ? '0' : expression,",
                      '                style: TextStyle(',
                      '                  fontSize: compact ? 18 : 21,',
                      '                  color: dark ? Colors.white70 : Theme.of(context).colorScheme.onSurfaceVariant,',
                      '                ),',
                      '              ),',
                      '            ),',
                      '          ),',
                      '        ),',
                      '        SingleChildScrollView(',
                      '          scrollDirection: Axis.horizontal,',
                      '          reverse: true,',
                      '          child: Text(',
                      '            result,',
                      '            style: TextStyle(',
                      '              fontSize: compact ? 34 : 42,',
                      '              fontWeight: FontWeight.w900,',
                      '              color: dark ? Colors.white : Theme.of(context).colorScheme.onSurface,',
                      '            ),',
                      '          ),',
                      '        ),',
                      '      ],',
                      '    ),',
                      '  );',
                  ]
                  if lines[i:i + 1] != replacement:
                      lines[i:i + 1] = replacement
                      changed = True
                      print('Fixed calculator display syntax')
                  break
          calc.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if changed:
              print('Source fixes applied; committing them to master.')
          else:
              print('No source fixes needed.')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/tool_calculator_page.dart lib/category_page.dart lib/calculator_suite.dart
            git commit -m "Fix source issues detected by CI"
            git push
          fi

      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Verify Android Play configuration
        run: |
          test -f android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          echo 'Android project present and locked to API 36.'

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utilia-release-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
