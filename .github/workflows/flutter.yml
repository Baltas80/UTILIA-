name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: false
          pub-cache: false

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify Android Play configuration
        run: |
          test -f android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'applicationId = "com.utilia.app.utilia"' android/app/build.gradle.kts
          echo 'Android project present and locked to API 36.'

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Verify release artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: utilia-release-builds
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
