name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utilia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UTILIA_KEYSTORE_PASSWORD: ${{ secrets.UTILIA_KEYSTORE_PASSWORD }}
      UTILIA_KEY_ALIAS: ${{ secrets.UTILIA_KEY_ALIAS }}
      UTILIA_KEY_PASSWORD: ${{ secrets.UTILIA_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: false
          pub-cache: false

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Scan tracked source for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sk_(live|test)_[A-Za-z0-9]{16,})' -- ':!*.lock'; then
            echo 'Potential credential material found in tracked source.' >&2
            exit 1
          fi
          echo 'No known high-risk credential patterns found in tracked source.'

      - name: Format Dart source
        run: dart format lib test

      - name: Commit formatting on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Dart source is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'chore: apply dart format [skip ci]'
          git push origin HEAD:master

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify Android Play configuration
        shell: bash
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'applicationId = "com.utilia.app.utilia"' android/app/build.gradle.kts
          grep -Eq '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' pubspec.yaml
          grep -q 'android:exported="true"' android/app/src/main/AndroidManifest.xml
          echo 'Android configuration validated.'

      - name: Prepare production signing keystore
        shell: bash
        env:
          UTILIA_KEYSTORE_BASE64: ${{ secrets.UTILIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$UTILIA_KEYSTORE_BASE64"
          test -n "$UTILIA_KEYSTORE_PASSWORD"
          test -n "$UTILIA_KEY_ALIAS"
          test -n "$UTILIA_KEY_PASSWORD"

          keystore_path="$RUNNER_TEMP/utilia-upload-key.jks"
          printf '%s' "$UTILIA_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "UTILIA_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Verify production signing
        shell: bash
        run: |
          test -s "$UTILIA_KEYSTORE_FILE"
          keytool -list -keystore "$UTILIA_KEYSTORE_FILE" \
            -alias "$UTILIA_KEY_ALIAS" \
            -storepass "$UTILIA_KEYSTORE_PASSWORD" >/dev/null
          echo 'Production upload keystore is valid.'

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Verify release artifacts and signatures
        shell: bash
        run: |
          set -euo pipefail

          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          aab_path="build/app/outputs/bundle/release/app-release.aab"

          test -s "$apk_path"
          test -s "$aab_path"

          normalize_fingerprint() {
            printf '%s' "$1" | tr -d ' :\t\r\n' | tr '[:upper:]' '[:lower:]'
          }

          production_fingerprint="$(keytool -list -v \
            -keystore "$UTILIA_KEYSTORE_FILE" \
            -alias "$UTILIA_KEY_ALIAS" \
            -storepass "$UTILIA_KEYSTORE_PASSWORD" |
            awk -F': ' '/SHA256:/{print $2; exit}')"
          production_fingerprint="$(normalize_fingerprint "$production_fingerprint")"
          test -n "$production_fingerprint"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk_path"

          apk_fingerprint="$("$apksigner" verify --print-certs "$apk_path" 2>/dev/null |
            awk '/Signer #1 certificate SHA-256 digest:/{getline; print; exit}')"
          apk_fingerprint="$(normalize_fingerprint "$apk_fingerprint")"
          echo "Production certificate SHA-256: $production_fingerprint"
          echo "APK certificate SHA-256:        $apk_fingerprint"
          test -n "$apk_fingerprint"
          test "$apk_fingerprint" = "$production_fingerprint"

          jarsigner -verify -verbose "$aab_path" >/dev/null

          aab_fingerprint="$(keytool -printcert -jarfile "$aab_path" |
            awk -F': ' '/SHA256:/{print $2; exit}')"
          aab_fingerprint="$(normalize_fingerprint "$aab_fingerprint")"
          echo "AAB certificate SHA-256:        $aab_fingerprint"
          test -n "$aab_fingerprint"
          test "$aab_fingerprint" = "$production_fingerprint"

          sha256sum "$apk_path" "$aab_path"
          ls -lh "$apk_path" "$aab_path"
          echo 'APK and AAB are signed by the configured production upload key.'

      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: utilia-release-builds
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
