name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - run: flutter pub get

      - name: Repair known Dart syntax issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = False

          def replace(path, old, new):
              global changes
              p = Path(path)
              text = p.read_text()
              updated = text.replace(old, new)
              if updated != text:
                  p.write_text(updated)
                  changes = True

          replace('lib/tool_calculator_page.dart', '  bool _isConverter =>', '  bool get _isConverter =>')
          replace('lib/main_premium.dart', 'style: Theme.of(context).textTheme.labelLarge)]))));', 'style: Theme.of(context).textTheme.labelLarge)])))));')
          replace('lib/main_premium.dart', 'style: Theme.of(context).textTheme.bodyMedium)])), IconButton(onPressed: () => _favorite(tool.type), icon: Icon(favorite ? Icons.favorite_rounded : Icons.favorite_border_rounded, color: favorite ? accent : Theme.of(context).colorScheme.outline))]))));', 'style: Theme.of(context).textTheme.bodyMedium)])), IconButton(onPressed: () => _favorite(tool.type), icon: Icon(favorite ? Icons.favorite_rounded : Icons.favorite_border_rounded, color: favorite ? accent : Theme.of(context).colorScheme.outline))])))));')
          replace('lib/main_premium.dart', "${h['expression']} = ${h['result']}'))))]);", "${h['expression']} = ${h['result']}')))))]);")
          replace('lib/category_page.dart', 'style: Theme.of(context).textTheme.bodyMedium)])));\n  }\n}\n\nvoid openUtiliaTool', 'style: Theme.of(context).textTheme.bodyMedium)]))));\n  }\n}\n\nvoid openUtiliaTool')

          if changes:
              import subprocess
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'lib/category_page.dart', 'lib/main_premium.dart', 'lib/tool_calculator_page.dart'], check=True)
              subprocess.run(['git', 'commit', '-m', 'Fix Dart syntax errors'], check=True)
              subprocess.run(['git', 'push'], check=True)
          PY

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Bootstrap Android project
        run: flutter create . --platforms=android --project-name utilia --org com.utilia.app

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utilia-release-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
