name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - run: flutter pub get

      - name: Repair source issues detected by analyzer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              'lib/tool_calculator_page.dart': [
                  ("import 'catalog.dart';\n", ''),
                  ("Text(widget.s.result,\n", "Text(widget.s.result, style: Theme.of(context).textTheme.bodyMedium),\n"),
              ],
              'lib/category_page.dart': [
                  ("import 'catalog.dart';\n", ''),
              ],
          }

          changed = False
          for filename, replacements in fixes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True
                  print(f'Fixed {filename}')

          if changed:
              print('Source fixes applied; committing them to master.')
          else:
              print('No source fixes needed.')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/tool_calculator_page.dart lib/category_page.dart
            git commit -m "Fix analyzer issues in calculator pages"
            git push
          fi

      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Bootstrap Android project
        run: flutter create . --platforms=android --project-name utilia --org com.utilia.app

      - name: Prepare Android for Google Play
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              p.write_text(text, encoding='utf-8')
              print('Android compileSdk/targetSdk locked to API 36.')
          else:
              raise SystemExit('android/app/build.gradle.kts was not generated')
          PY

      - name: Persist Android project in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Add Android project for Google Play release"
            git push
          else
            echo "Android project already present and unchanged."
          fi

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utilia-release-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
